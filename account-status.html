<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud AI — Account Status</title>
<style>
:root{color-scheme:dark;--cyan:#20d4ff;--blue:#3b78ff;--purple:#d044ff;--line:#3049a0;--text:#eef5ff;--muted:#a9c7fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#12163b,#070b1d 48%,#030611);font-family:Inter,system-ui,Segoe UI,sans-serif;color:var(--text);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:0;width:340px;height:340px;border-radius:50%;filter:blur(75px);opacity:.23;pointer-events:none;background:#2521bd}body:before{left:-210px;bottom:2%}body:after{right:-200px;top:8%;background:#6b20d9}
main{z-index:1;width:min(100%,650px);text-align:center}.icon{width:140px;height:115px;margin:0 auto 16px;filter:drop-shadow(0 0 16px #386dff80)}svg{max-width:100%}
h1{font-size:clamp(2.25rem,7vw,3.5rem);line-height:1.1;letter-spacing:-.045em;margin:0 0 20px;font-weight:800;background:linear-gradient(90deg,var(--cyan),#5875ff 52%,var(--purple));color:transparent;background-clip:text;-webkit-background-clip:text}
.lead{max-width:560px;margin:0 auto 28px;font-size:1.12rem;line-height:1.65;color:#d6e5ff}
.panel{padding:22px 24px;margin:0 auto 28px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#0b122ce8,#080d21d9);text-align:left;box-shadow:0 18px 65px #0004}
.panelhead{display:flex;gap:13px;align-items:center;font-weight:700;margin-bottom:10px}.info{width:32px;height:32px;display:grid;place-items:center;border:2px solid #9861ff;color:#a987ff;border-radius:50%;font-size:20px;flex-shrink:0}
ul{margin:0;padding-left:49px;color:#91c4ff;line-height:1.85}li{padding-left:2px}
.actions{display:grid;gap:14px;max-width:450px;margin:auto}.btn{min-height:62px;border-radius:19px;display:flex;align-items:center;justify-content:center;gap:12px;font:inherit;font-size:1.08rem;text-decoration:none;cursor:pointer;transition:filter .15s,transform .15s}.btn:hover{filter:brightness(1.15);transform:translateY(-2px)}.primary{color:white;border:0;background:linear-gradient(105deg,#078fff,#7441ff 72%,#d039f4);box-shadow:0 8px 30px #4c45ff30}.secondary{color:#9bcaff;border:1px solid #276de7;background:#080e25b8}.btn svg{width:22px;height:22px}.note{color:#9ebcf0;font-size:.91rem;line-height:1.7;margin:32px auto 0}.status{min-height:24px;color:#b9ceff;margin-top:12px;font-size:.9rem}
@media(max-width:480px){.icon{width:118px;height:98px}.panel{padding:18px 16px}ul{padding-left:26px}}
</style></head>
<body><main>
<div class="icon" id="icon"></div><h1 id="title">Account Status</h1><p class="lead" id="lead"></p>
<section class="panel"><div class="panelhead"><span class="info">!</span><span id="panelTitle"></span></div><ul id="reasons"></ul></section>
<div class="actions"><button class="btn primary" id="retry">↻ &nbsp; Try Again</button><a class="btn secondary" href="./">⌂ &nbsp; Go to Home</a></div>
<div class="status" id="status" role="status" aria-live="polite"></div><p class="note" id="note"></p>
</main>
<script>
const cloudIcon = (inner) => `<svg viewBox="0 0 160 120" width="150" height="115" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="12" y1="20" x2="146" y2="100"><stop stop-color="#20D5FF"/><stop offset=".52" stop-color="#367BFF"/><stop offset="1" stop-color="#D345FF"/></linearGradient></defs><path d="M42 96H119C139 96 151 82 151 65C151 47 137 35 119 35C111 13 92 4 75 9C57 14 47 27 44 43C25 42 10 55 10 73C10 87 23 96 42 96Z" stroke="url(#g)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>${inner}</svg>`;
const states = {
 banned: {title:'Account Banned',lead:'Your account has been restricted from using Cloud AI. If you believe this is a mistake, please contact support.',panel:'Possible reasons:',items:['Your account has been restricted by an administrator.','Your account may have violated the service terms.','If you think this is a mistake, contact support for assistance.'],note:'If you need help, contact support with your account details.',icon:'<rect x="60" y="54" width="43" height="34" rx="8" fill="url(#g)"/><path d="M69 54V43C69 34 75 28 82 28C90 28 95 34 95 43V54" stroke="url(#g)" stroke-width="7" stroke-linecap="round"/><circle cx="81.5" cy="69" r="4" fill="#081126"/><path d="M81.5 72V78" stroke="#081126" stroke-width="3" stroke-linecap="round"/><circle cx="119" cy="83" r="18" fill="#be43f2" stroke="#071027" stroke-width="4"/><path d="m111 75 16 16m0-16-16 16" stroke="#071027" stroke-width="4" stroke-linecap="round"/>'},
 deleted: {title:'Data Not Found',lead:'Your account data could not be found or may have been deleted. Your chats and settings are not available from cloud storage.',panel:'This can happen if:',items:['Your cloud data was deleted from the server.','Your account was removed or closed.','There was a problem setting up your account data.','If this seems wrong, contact support.'],note:'Your browser may still have a local copy of your chats. Avoid clearing browser data while troubleshooting.',icon:'<path d="M57 31h38l17 17v36a7 7 0 0 1-7 7H57a7 7 0 0 1-7-7V38a7 7 0 0 1 7-7Z" fill="url(#g)"/><path d="M95 31v18h17M63 54h27M63 65h27M63 76h18" stroke="#071027" stroke-width="4" stroke-linecap="round"/><circle cx="112" cy="83" r="18" fill="#be43f2" stroke="#071027" stroke-width="4"/><path d="m105 76 14 14m0-14-14 14" stroke="#071027" stroke-width="4" stroke-linecap="round"/>'}
};
const params = new URLSearchParams(location.search);
const key = params.get('status') === 'banned' ? 'banned' : 'deleted';
const state = states[key];
document.title = `Cloud AI — ${state.title}`;
document.getElementById('title').textContent=state.title;
document.getElementById('lead').textContent=state.lead;
document.getElementById('panelTitle').textContent=state.panel;
document.getElementById('note').textContent=state.note;
document.getElementById('icon').innerHTML=cloudIcon(state.icon);
document.getElementById('reasons').innerHTML=state.items.map(x=>`<li>${x}</li>`).join('');
document.getElementById('retry').addEventListener('click',()=>{location.href='./';});
</script></body></html>
